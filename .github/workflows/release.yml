name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # 构建桌面端到 ui/（npm pack 与 zip 都要它）
      - run: npm run build
      # npm 包：tarball 丢进 dist/（避免弄脏工作区，pack-release 有干净树闸门）
      - run: mkdir -p dist && npm pack --pack-destination dist
      # zip：双击 parallel.cmd 的路线（slim，不带 node_modules）
      - run: node scripts/pack-release.mjs --slim
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "parallel $GITHUB_REF_NAME"
          --generate-notes
          dist/*.tgz dist/*.zip
